name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Aspnet_server.sln

      - name: Build
        run: dotnet build Aspnet_server.sln --no-restore

      - name: Test
        run: dotnet test tests/Aspnet_server.Tests/Aspnet_server.Tests.csproj --no-build --logger "console;verbosity=minimal"

      - name: Dependency vulnerability check
        run: dotnet list Aspnet_server.csproj package --vulnerable --include-transitive
